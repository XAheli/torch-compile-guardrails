[project]
name = "torch-compile-guardrails"
version = "0.1.0"
description = "Activation-based LLM safety checks inside torch.compile (SciPy India 2026 talk prototype)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
  { name = "Aheli Poddar" },
  { name = "Arkadip Maitra" },
]
dependencies = [
  # torch / triton come from the local pytorch-devcontainers editable build
  # (see scripts/activate_guardrails_env.sh) — do not install torch from PyPI.
  "transformers>=4.46",
  "huggingface_hub>=0.26",
  "safetensors>=0.4",
  "sentencepiece>=0.2",
  "protobuf>=4.25",
  "numpy>=1.26",
  # Runtime dependencies of the linked local PyTorch build. Declared here so
  # uv does not need to resolve/install the PyPI torch package or its CUDA stack.
  "sympy>=1.14",
  "networkx>=3.6",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
]
train = [
  "datasets>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/torch_compile_guardrails"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Local editable pytorch + triton are wired by scripts/link_local_torch.sh.
# Keep the resolver on 3.12 (matches pytorch/.venv) and skip PyPI torch/triton.
[tool.uv]
package = true
